<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536">
  <defs>
    <radialGradient id="safe" cx="50%" cy="47%" r="58%">
      <stop offset="0" stop-color="black"/>
      <stop offset=".58" stop-color="black"/>
      <stop offset=".8" stop-color="white"/>
      <stop offset="1" stop-color="white"/>
    </radialGradient>
    <mask id="inside-selection" maskUnits="userSpaceOnUse" mask-type="luminance">
      <rect width="1024" height="1536" fill="url(#safe)"/>
      <!-- Geen gesloten avatarovaal: vier overlappende lobselecties houden de
           rook onregelmatig. Zwaar rechts(boven), klein linksboven en beperkt
           onderaan, zoals in de referentie. -->
      <g fill="white">
        <ellipse cx="610" cy="410" rx="105" ry="82"/>
        <ellipse cx="785" cy="470" rx="178" ry="152"/>
        <ellipse cx="838" cy="628" rx="154" ry="188"/>
        <ellipse cx="720" cy="730" rx="148" ry="86"/>
      </g>
    </mask>
  </defs>
  <rect width="1024" height="1536" fill="white" mask="url(#inside-selection)"/>
</svg>
