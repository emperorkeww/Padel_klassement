    <!-- Edelsteen-chevron in de schildpunt. -->
    <path d="M412 1396 C456 1380 570 1380 612 1396 C626 1428 616 1472 584 1504 C556 1532 536 1554 512 1554 C488 1554 468 1532 440 1504 C408 1472 398 1428 412 1396 Z" />
  </g>
</svg>
