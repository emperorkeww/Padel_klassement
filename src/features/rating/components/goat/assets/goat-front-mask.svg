<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1664">
  <!-- Voorselectie: alleen complete objectgroepen die het frame werkelijk
       bedekken — de kristalpunten die op de referentie over de flankranden heen
       groeien en de edelsteen-chevron in de schildpunt. Tussen die zones blijft
       het frame zichtbaar, zodat de volgorde achter → voor → achter leesbaar
       is. Elk pad blijft binnen de bijbehorende uitsnede op het mastercanvas
       (kristal links x 138..182 / y 911..1065, kristal rechts x 842..886 /
       y 1029..1117, edelsteen x 393..631 / y 1368..1564). -->
  <defs>
    <filter id="soft" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
  </defs>
  <g fill="#fff" filter="url(#soft)">
    <!-- Kristalpunten linkerflank. -->
    <path d="M104 946 C134 926 164 942 172 982 C178 1014 172 1036 156 1046 C132 1060 106 1046 98 1014 C92 986 92 958 104 946 Z" />
    <!-- Kristalpunten rechterflank. -->
