<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560">
  <!-- Placeholder voor storm-cloud-back-right.webp (#834): de grote achterste
       cumulonimbus rechts van de kaart. Licht (goud) komt van links, waar de
       hoofdbliksem loopt. Vervang door een fotorealistische webp met alpha;
       zie ../MANIFEST.md voor de exacte inhoudseisen. -->
  <defs>
    <radialGradient id="bol" cx="32%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#414e6e"/>
      <stop offset="42%" stop-color="#252d41"/>
      <stop offset="100%" stop-color="#0e1220"/>
    </radialGradient>
    <radialGradient id="bolLicht" cx="26%" cy="22%" r="78%">
      <stop offset="0%" stop-color="#5b6890"/>
      <stop offset="45%" stop-color="#2e3752"/>
      <stop offset="100%" stop-color="#121627"/>
    </radialGradient>
    <radialGradient id="goudRand" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd97a" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#f0b84e" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#f0b84e" stop-opacity="0"/>
    </radialGradient>
    <filter id="b12" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b3" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.3"/></filter>
  </defs>

  <!-- Zacht silhouet van de hele massa -->
  <g filter="url(#b12)" fill="#0a0e18" opacity=".95">
    <ellipse cx="215" cy="95" rx="150" ry="82"/>
    <ellipse cx="120" cy="150" rx="95" ry="62"/>
    <ellipse cx="265" cy="205" rx="125" ry="88"/>
    <ellipse cx="225" cy="330" rx="118" ry="86"/>
    <ellipse cx="255" cy="445" rx="105" ry="72"/>
    <ellipse cx="205" cy="510" rx="80" ry="46"/>
  </g>

  <!-- Middenvolume -->
  <g filter="url(#b6)" fill="#161c2b">
    <ellipse cx="210" cy="100" rx="128" ry="66"/>
    <ellipse cx="122" cy="148" rx="76" ry="48"/>
    <ellipse cx="262" cy="208" rx="104" ry="70"/>
    <ellipse cx="228" cy="332" rx="98" ry="70"/>
    <ellipse cx="252" cy="446" rx="86" ry="58"/>
    <ellipse cx="206" cy="508" rx="62" ry="36"/>
  </g>

  <!-- Donkere kernen rechtsonder in elke cluster -->
  <g filter="url(#b6)" fill="#05070d" opacity=".78">
    <ellipse cx="252" cy="122" rx="92" ry="54"/>
    <ellipse cx="292" cy="240" rx="84" ry="60"/>
    <ellipse cx="262" cy="368" rx="80" ry="58"/>
    <ellipse cx="282" cy="470" rx="68" ry="46"/>
  </g>

  <!-- Bloemkoollobben op de randen -->
  <g filter="url(#b1)">
    <circle cx="150" cy="70" r="30" fill="url(#bolLicht)"/>
    <circle cx="185" cy="52" r="33" fill="url(#bolLicht)"/>
    <circle cx="225" cy="48" r="34" fill="url(#bol)"/>
    <circle cx="265" cy="60" r="30" fill="url(#bol)"/>
    <circle cx="300" cy="85" r="27" fill="url(#bol)"/>
    <circle cx="322" cy="115" r="23" fill="url(#bol)"/>
    <circle cx="135" cy="95" r="22" fill="url(#bolLicht)"/>
    <circle cx="75" cy="135" r="21" fill="url(#bolLicht)"/>
    <circle cx="100" cy="115" r="25" fill="url(#bolLicht)"/>
    <circle cx="135" cy="122" r="24" fill="url(#bol)"/>
    <circle cx="215" cy="170" r="26" fill="url(#bolLicht)"/>
    <circle cx="255" cy="160" r="29" fill="url(#bol)"/>
    <circle cx="295" cy="175" r="26" fill="url(#bol)"/>
    <circle cx="330" cy="205" r="23" fill="url(#bol)"/>
    <circle cx="342" cy="242" r="20" fill="url(#bol)"/>
    <circle cx="170" cy="305" r="24" fill="url(#bolLicht)"/>
    <circle cx="205" cy="285" r="28" fill="url(#bolLicht)"/>
    <circle cx="245" cy="290" r="29" fill="url(#bol)"/>
    <circle cx="285" cy="310" r="25" fill="url(#bol)"/>
    <circle cx="312" cy="345" r="22" fill="url(#bol)"/>
    <circle cx="210" cy="420" r="23" fill="url(#bolLicht)"/>
    <circle cx="245" cy="405" r="26" fill="url(#bol)"/>
    <circle cx="285" cy="420" r="24" fill="url(#bol)"/>
    <circle cx="316" cy="450" r="20" fill="url(#bol)"/>
    <circle cx="175" cy="495" r="17" fill="url(#bolLicht)"/>
    <circle cx="215" cy="485" r="19" fill="url(#bol)"/>
    <circle cx="246" cy="500" r="17" fill="url(#bol)"/>
  </g>

  <!-- Goudlicht op de linkerflank (bliksemzijde) en enkele lobtoppen -->
  <g filter="url(#b6)">
    <ellipse cx="95" cy="190" rx="52" ry="92" fill="url(#goudRand)"/>
    <ellipse cx="150" cy="300" rx="42" ry="82" fill="url(#goudRand)"/>
    <ellipse cx="185" cy="420" rx="38" ry="66" fill="url(#goudRand)"/>
  </g>
  <g filter="url(#b3)" opacity=".55">
    <ellipse cx="185" cy="44" rx="42" ry="13" fill="#ffd97a" opacity=".5"/>
    <ellipse cx="205" cy="278" rx="36" ry="11" fill="#ffd97a" opacity=".45"/>
    <ellipse cx="208" cy="414" rx="32" ry="10" fill="#ffd97a" opacity=".4"/>
    <ellipse cx="98" cy="112" rx="30" ry="10" fill="#ffd97a" opacity=".4"/>
  </g>
</svg>
