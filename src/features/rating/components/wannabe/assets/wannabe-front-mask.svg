<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1440">
  <!-- Voorselectie: de onderdelen die in de referentie óver de lijst liggen — racketcrest, megafoonmedaillon, beide plakstroken, beide briefjes met hun pijlen, de afgesprongen splinter, het kroontje met krassenbundel en de inktdruipers. Elke vorm is de contour van het bijbehorende onderdeel uit scripts/wannabe-master.py, dus een maskervorm kan niet los van een voorwerp verschuiven. Er staat bewust geen zwarte achtergrondrect in: CSS mask met een SVG-image valt in match-source terug op alpha, niet op luminance, en een dekkende zwarte rect laat dan de hele master door. -->
