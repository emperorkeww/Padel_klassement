<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c8a5f" />
    <meta
      name="description"
      content="Vamos! — leg je padelmatches vast, volg je klassement en speel mee in je groep."
    />

    <!--
      Thema vóór de eerste paint toepassen (geen lichte flits bij donker
      thema). Zelfde resolutie als src/lib/theme.ts: localStorage["theme"]
      (system|light|dark, default system), waarbij "system" de OS-voorkeur
      volgt. Houd dit script en theme.ts samen in sync.
    -->
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("theme");
        } catch (e) {
          /* private mode e.d.: val terug op systeem */
        }
        var dark =
          pref === "dark" ||
          (pref !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#121814" : "#0c8a5f");
      })();
    </script>

    <!-- PWA: installeerbaar op het beginscherm (Add to Home Screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vamos!" />

    <!--
      Start de DNS/TLS-handshake naar Supabase vroeg, zodat de eerste
      auth-request sneller is. Vite vult %VITE_SUPABASE_URL% bij de build in.
    -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />

    <!-- Huisstijl-lettertype (Outfit): sportief-geometrisch, variabel gewicht.
         Self-hosted via @font-face in src/app/index.css (#462) i.p.v. de Google
         Fonts CDN, zodat de service worker het meecachet en de app offline
         consistent rendert. -->

    <title>Vamos!</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
