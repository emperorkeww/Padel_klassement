name: Deploy

# Elke push naar main (dus ook een merge van develop) bouwt de app met de
# productie-Supabase-waarden en deployt de Cloudflare Worker (wrangler.jsonc).
# Handmatig herdeployen kan via "Run workflow" (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nooit twee deploys door elkaar; een nieuwere push vervangt een lopende.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite bakt VITE_-vars tijdens de build in de bundle; de productie-
      # waarden komen uit de GitHub-secrets (zie README/.env.example).
      - name: Build met productie-Supabase
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Publieke VAPID-sleutel voor push-meldingen (mag leeg zijn:
          # de app verbergt de optie dan gewoon).
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # Gebruikt de wrangler-versie uit package.json (devDependency); zonder
      # die pin valt de action terug op een oude wrangler die wrangler.jsonc
      # niet begrijpt.
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
