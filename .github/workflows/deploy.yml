name: Deploy

# Na een merge naar main wacht deze workflow tot CI op exact die commit slaagt.
# Daarna worden eerst de Supabase-migraties en Edge Functions, en pas daarna de
# frontend/Worker uitgerold. Een PR-branch krijgt dus nooit productie-secrets.
# Handmatig herdeployen kan via "Run workflow" (workflow_dispatch).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Nooit twee deploys door elkaar; een nieuwere push vervangt een lopende.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    # workflow_dispatch heeft geen workflow_run-payload. Bij automatische runs
    # mag enkel een geslaagde CI-run op main door naar productie.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # `db push` praat rechtstreeks met Postgres, niet met de Management API:
      # zonder wachtwoord blijft de CLI om invoer vragen en hangt de job.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy de commit die CI heeft gevalideerd, niet de branch-tip die
          # intussen alweer kan zijn veranderd.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.75.0

      # Vroege, leesbare stop: zonder deze secrets faalt de CLI verderop met een
      # cryptische usage-melding, en dat kostte een halve release om te zien.
      - name: Controleer Supabase-secrets
        run: |
          for naam in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!naam}" ]; then
              echo "::error::$naam ontbreekt in de repository-secrets — zie README §Deployment."
              exit 1
            fi
          done

      # `db push` kent geen --project-ref: het commando werkt op het gelinkte
      # project. Linken is dus een eigen stap, niet een vlag.
      - name: Link productieproject
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      # Vite bakt VITE_-vars tijdens de build in de bundle; de productie-
      # waarden komen uit de GitHub-secrets (zie README/.env.example).
      - name: Build met productie-Supabase
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Publieke VAPID-sleutel voor push-meldingen (mag leeg zijn:
          # de app verbergt de optie dan gewoon).
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # Gebruikt de wrangler-versie uit package.json (devDependency); zonder
      # die pin valt de action terug op een oude wrangler die wrangler.jsonc
      # niet begrijpt.
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # NB: CRON_SECRET wordt NIET per deploy gezet (#466). wrangler-action's
          # `secrets:`-invoer draait `wrangler secret bulk`, wat botst met de
          # Worker-versions-modus (Cloudflare-fout 10215: "latest version isn't
          # currently deployed"). Worker-secrets zijn persistent, dus zet het
          # geheim één keer out-of-band en laat de deploy alleen code+assets doen:
          #   npx wrangler secret put CRON_SECRET   # waarde = PLAYTOMIC_CRON_SECRET
          # De Worker leest env.CRON_SECRET; het geheim blijft over deploys heen bestaan.
