name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Een nieuwere push op dezelfde branch/PR vervangt een lopende run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Dummy Supabase-env zodat build/tests niet crashen op ontbrekende vars.
    # (De echte waarden staan in Cloudflare Pages, niet in CI.)
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-check + bundle)
        run: npm run build

      - name: Test
        run: npm test

  # pgTAP-databasetests (RLS-policies, RPC's) tegen een lokale Supabase-stack.
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Versie gepind op de lokaal geverifieerde CLI: nieuwere versies passen
      # migrations bij `db start` anders toe, waardoor de default-grants voor
      # authenticated ontbreken en rls_rpc_test faalt op "permission denied".
      - uses: supabase/setup-cli@v3
        with:
          version: 2.75.0

      - name: Start lokale database
        run: supabase db start

      - name: Databasetests (pgTAP)
        run: supabase test db

      # Faalt als src/lib/supabase/database.types.ts achterloopt op het schema
      # (#60). Regenereren kan lokaal met `npm run gen:types` (zelfde gepinde
      # CLI-versie, dus byte-gelijke output).
      - name: Check gegenereerde types actueel
        run: |
          supabase gen types typescript --local > src/lib/supabase/database.types.ts
          git diff --exit-code -- src/lib/supabase/database.types.ts
