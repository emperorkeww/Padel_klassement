name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Een nieuwere push op dezelfde branch/PR vervangt een lopende run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Dummy Supabase-env zodat build/tests niet crashen op ontbrekende vars.
    # (De echte waarden staan in Cloudflare Pages, niet in CI.)
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-check + bundle)
        run: npm run build

      - name: Test
        run: npm test

  # pgTAP-databasetests (RLS-policies, RPC's) tegen een lokale Supabase-stack.
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start lokale database
        run: supabase db start

      - name: Databasetests (pgTAP)
        run: supabase test db
