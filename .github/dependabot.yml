# Houdt dependencies actueel: npm wekelijks (minor/patch gebundeld in één PR,
# majors apart), GitHub Actions maandelijks.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # PR's tegen develop, zodat updates de normale develop → main-flow volgen.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-en-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly